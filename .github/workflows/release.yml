name: Release

# Three jobs, so the release key only ever meets code from main:
#   build    checks, builds and packages the release with no secrets, and hands dist/ on.
#   sign     runs in the `release` environment, the only place FLYTOWER_SIGNING_KEY lives.
#            The environment only lets main and v* tags in, and asks Matt to approve each
#            run. It checks out nothing but the signing script and the public key, from the
#            branch or tag the workflow runs on, and signs dist/SHA256SUMS.
#   publish  creates the tag and the GitHub release from the signed files.
on:
  push:
    tags: ['v*']
  # Releasing from the Actions tab creates the tag too.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 0.1.0
        required: true
      ref:
        description: Tag, branch or commit to release, e.g. v1.1.0-beta.6 (default the branch above)
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # To read the E2E runs the gate below checks.
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      target_sha: ${{ steps.tag.outputs.target_sha }}
      not_latest: ${{ steps.tag.outputs.not_latest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Work out the tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          # Release summaries and the notes script come from the branch this runs on, so an
          # older commit can be released with a summary written after it.
          cp -r .github/release-notes "$RUNNER_TEMP/release-notes"
          cp scripts/release-notes.ts "$RUNNER_TEMP/release-notes.ts"
          # So is the E2E gate, which an older commit may not have.
          cp scripts/e2e-gate.ts "$RUNNER_TEMP/e2e-gate.ts"
          cp .github/workflows/e2e.yml "$RUNNER_TEMP/e2e.yml"
          sha="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version="${INPUT_VERSION#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version $version"; exit 1; }
            # Native builds (native-<version> tags, 1.2 to 1.4) ended in 1.5.0, when every
            # release got the Rust agent. Panels no longer look for them.
            if [[ "$version" =~ -(.+\.)?native\.[0-9]+$ ]]; then
              echo "::error::native builds are retired; release $version without the native counter"; exit 1
            fi
            tag="v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "$tag already exists"; exit 1; fi
            if [[ -n "$INPUT_REF" ]]; then
              sha="$(git rev-parse -q --verify "$INPUT_REF^{commit}" || git rev-parse -q --verify "origin/$INPUT_REF^{commit}")" ||
                { echo "::error::no tag, branch or commit called $INPUT_REF"; exit 1; }
              git checkout -q --detach "$sha"
            fi
            git tag "$tag" "$sha"
          else
            tag="$GITHUB_REF_NAME"
          fi
          version="${tag#v}"
          # A stable release older than the newest stable one mustn't become "Latest".
          newest="$(git tag -l 'v*' | grep -v -- - | sort -V | tail -n1)"
          not_latest=""
          if [[ "$tag" != *-* && "$newest" != "$tag" ]]; then not_latest=1; fi
          {
            echo "TAG=$tag"
            echo "VERSION=$version"
            echo "TARGET_SHA=$sha"
          } >> "$GITHUB_ENV"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "target_sha=$sha"
            echo "not_latest=$not_latest"
          } >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Releases only ship commits the E2E workflow (install, self-update, upgrades from every
      # minor version) passed on. It reuses main's run instead of running it again; for a
      # commit without one, run E2E on it from the Actions tab first.
      - name: E2E passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_WORKFLOW: ${{ runner.temp }}/e2e.yml
        run: bun "$RUNNER_TEMP/e2e-gate.ts" "$TARGET_SHA"

      - name: Rust toolchain (pinned in crates/rust-toolchain.toml)
        run: cd crates && rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates
      - name: Go toolchain (pinned in go/go.mod)
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Java (for the flytower-proxy mod, mods/flytower-proxy)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: mods/flytower-proxy/*.gradle*

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: shellcheck installer/*.sh

      - name: Build panel
        run: bun run build

      - name: Package
        run: |
          version="$VERSION"
          bun scripts/package.ts --version "$version" --arch amd64 --out dist
          bun scripts/package.ts --version "$version" --arch arm64 --out dist
          cp installer/install.sh dist/install.sh
          cd dist && sha256sum flytower-*.tar.gz install.sh > SHA256SUMS && cat SHA256SUMS

      - name: Release notes
        run: |
          mkdir -p .github/release-notes
          cp "$RUNNER_TEMP"/release-notes/*.md .github/release-notes/
          bun "$RUNNER_TEMP/release-notes.ts" "$TAG" > dist/NOTES.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned
          path: dist/
          retention-days: 1
          if-no-files-found: error

  sign:
    needs: build
    runs-on: ubuntu-24.04
    # Holds FLYTOWER_SIGNING_KEY. Its deployment rules (main and v* tags, Matt's approval)
    # keep pull requests and other branches away from the key.
    environment: release
    permissions:
      contents: read
    steps:
      # Only what signing needs, from the branch or tag this workflow runs on: never the
      # code being released, which the build job has already packaged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            package.json
            scripts/signing-key.ts
            installer/release-key.pem
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned
          path: dist

      - name: Sign
        env:
          FLYTOWER_SIGNING_KEY: ${{ secrets.FLYTOWER_SIGNING_KEY }}
        run: |
          if [[ -z "$FLYTOWER_SIGNING_KEY" ]] || grep -q PENDING installer/release-key.pem; then
            echo "::error::FLYTOWER_SIGNING_KEY and installer/release-key.pem are both needed to release"
            exit 1
          fi
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          # Accepts the key however it was pasted (PEM, flattened, OpenSSH) and writes PKCS#8.
          bun scripts/signing-key.ts "$key"
          if ! openssl pkey -in "$key" -noout 2>/dev/null; then
            echo "::error::FLYTOWER_SIGNING_KEY isn't a private key openssl can read. It should be the whole file from 'openssl genpkey -algorithm ed25519' or 'ssh-keygen -t ed25519'."
            exit 1
          fi
          if [[ "$(openssl pkey -in "$key" -pubout)" != "$(cat installer/release-key.pem)" ]]; then
            echo "::error::FLYTOWER_SIGNING_KEY doesn't match installer/release-key.pem"
            exit 1
          fi
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/SHA256SUMS | base64 -w0 > dist/SHA256SUMS.sig
          # Check against the committed key, as the installer will.
          base64 -d dist/SHA256SUMS.sig > sig.bin
          openssl pkeyutl -verify -pubin -inkey installer/release-key.pem -rawin \
            -in dist/SHA256SUMS -sigfile sig.bin
          rm sig.bin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signature
          path: dist/SHA256SUMS.sig
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signature
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          TARGET_SHA: ${{ needs.build.outputs.target_sha }}
          NOT_LATEST: ${{ needs.build.outputs.not_latest }}
        run: |
          version="$VERSION"
          flags=()
          # Everything before 1.0 is a pre-release.
          if [[ "$version" == 0.* || "$version" == *-* ]]; then flags+=(--prerelease); fi
          if [[ -n "${NOT_LATEST:-}" ]]; then flags+=(--latest=false); fi
          gh release create "$TAG" "${flags[@]}" --target "$TARGET_SHA" \
            --title "Flytower $version" \
            --notes-file dist/NOTES.md \
            dist/flytower-*.tar.gz dist/install.sh dist/SHA256SUMS dist/SHA256SUMS.sig
