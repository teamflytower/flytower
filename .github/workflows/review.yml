name: Review

# The Flytower Code Reviewer: Claude reviews every pull request when it's opened or marked
# ready for review, then each new push, posting as the Flytower Code Reviewer app. Each
# review has inline comments and either comments or requests changes; it never approves.
# A clean round dismisses the reviewer's own earlier requests for changes. After three
# rounds on one pull request it stops and leaves a note; start this workflow by hand with
# the pull request's number for another round. Label a pull request no-review to skip it.
#
# Claude only reads here. scripts/code-review.ts gathers the diff and the earlier review,
# and posts Claude's verdict, so nothing in a pull request can make it do more than review.
# The script and .github/reviewer/INSTRUCTIONS.md come from main, so a pull request can't
# rewrite its own reviewer (until they're on main, the pull request's own copies are used).
#
# Secrets and variables:
#   REVIEWER_CLIENT_ID       the app's client ID, as a variable or a secret
#   REVIEWER_PRIVATE_KEY     the app's private key (the whole .pem file)
#   CLAUDE_CODE_OAUTH_TOKEN  a Claude subscription token from `claude setup-token`, or
#   ANTHROPIC_API_KEY        an Anthropic API key, as for the Assistant workflow
# The app needs Pull requests read and write, and Contents read.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/release-notes/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review now (also past the three-round limit)
        required: true

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts, bots and pull requests from forks (which get no secrets) aren't reviewed.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.type != 'Bot' &&
        !contains(github.event.pull_request.labels.*.name, 'no-review')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      # The runner context isn't available to job-level env, so the paths are set here.
      - name: Set the working paths
        run: |
          echo "REVIEW_DIR=$RUNNER_TEMP/review" >> "$GITHUB_ENV"
          echo "TOOLS=$RUNNER_TEMP/reviewer" >> "$GITHUB_ENV"

      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.REVIEWER_CLIENT_ID || secrets.REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - id: pr
        name: Look up the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '
            "head=\(.head.sha)", "base=\(.base.sha)",
            "fork=\(.head.repo.full_name != .base.repo.full_name)"' >> "$GITHUB_OUTPUT"

      - name: Refuse forks
        if: steps.pr.outputs.fork == 'true'
        run: echo "Pull requests from forks aren't reviewed." && exit 1

      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Take the reviewer from main
        run: |
          mkdir -p "$TOOLS"
          cp scripts/code-review.ts .github/reviewer/INSTRUCTIONS.md "$TOOLS"/ 2>/dev/null || true

      - name: Check out the pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fall back to the pull request's reviewer
        run: |
          [[ -f "$TOOLS/code-review.ts" ]] || cp scripts/code-review.ts "$TOOLS"/
          [[ -f "$TOOLS/INSTRUCTIONS.md" ]] || cp .github/reviewer/INSTRUCTIONS.md "$TOOLS"/

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - id: prepare
        name: Gather the diff and the last review
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          BASE_SHA: ${{ steps.pr.outputs.base }}
          BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: bun "$TOOLS/code-review.ts" prepare

      - id: claude
        if: steps.prepare.outputs.review == 'true'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ !secrets.CLAUDE_CODE_OAUTH_TOKEN && secrets.ANTHROPIC_API_KEY || '' }}
          # Read only: the review is posted by the next step with the app's token.
          github_token: ${{ github.token }}
          # The log is public: keep the review out of it.
          display_report: 'false'
          prompt: >-
            Read ${{ env.TOOLS }}/INSTRUCTIONS.md and follow it. The pull request's context is
            in ${{ env.REVIEW_DIR }}/context.md. Answer with your verdict.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --add-dir ${{ env.TOOLS }}
            --add-dir ${{ env.REVIEW_DIR }}
            --allowedTools "Read,Glob,Grep"
            --disallowedTools "Bash,Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch,Task"
            --json-schema '{"type":"object","required":["verdict","summary","findings"],"properties":{"verdict":{"type":"string","enum":["request_changes","comment"]},"summary":{"type":"string"},"findings":{"type":"array","items":{"type":"object","required":["path","line","body"],"properties":{"path":{"type":"string"},"line":{"type":"integer"},"body":{"type":"string"}}}}}}'

      - name: Post the review
        if: steps.prepare.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          ROUND: ${{ steps.prepare.outputs.round }}
          VERDICT: ${{ steps.claude.outputs.structured_output }}
        run: bun "$TOOLS/code-review.ts" post
