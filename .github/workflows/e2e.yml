name: E2E

# Runs after each merge to main that touches the product, and on demand for a branch.
# Changes that only touch project housekeeping (release notes, the board and Assistant
# workflows, docs, unit tests) don't run it: they can't change what gets installed.
# The Release workflow reads this list too (scripts/e2e-gate.ts): a release passes on the
# last E2E run when everything since only touches these paths.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/release-notes/**'
      - '.github/assistant/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/assistant.yml'
      - '.github/workflows/board.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/go.yml'
      - '.github/workflows/mods.yml'
      - '.github/workflows/pr-build.yml'
      - '.github/workflows/release-notes.yml'
      - '.github/workflows/docs-screens.yml'
      - 'scripts/docs-screens.ts'
      - 'scripts/board-sync*.ts'
      - 'scripts/release-notes.ts'
      - 'scripts/e2e-gate*.ts'
      - 'scripts/*.test.ts'
      - 'apps/panel/test/**'
      # The help pages are built from docs/, but text can't change what gets installed.
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      all_upgrades:
        description: Test upgrades from every published release, not just the newest of each minor version
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds and packages once; the install and upgrade jobs share the tarballs.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Rust toolchain (pinned in crates/rust-toolchain.toml)
        run: cd crates && rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates
      - name: Go toolchain (pinned in go/go.mod)
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Java (for the flytower-proxy mod, mods/flytower-proxy)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: mods/flytower-proxy/*.gradle*
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The agents build the key in, so this comes before packaging. The private half never
      # leaves this job.
      - name: Throwaway signing key (never the real one)
        run: |
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/e2e-key.pem"
          openssl pkey -in "$RUNNER_TEMP/e2e-key.pem" -pubout -out installer/release-key.pem
          bun -e "
            const key = (await Bun.file('installer/release-key.pem').text()).trim()
            const s = await Bun.file('installer/install.sh').text()
            await Bun.write('installer/install.sh', s.replace(/(<<'KEY'\\n)[\\s\\S]*?(\\nKEY\\n)/, (_, a, b) => a + key + b))
          "
          grep -A3 "<<'KEY'" installer/install.sh

      - name: Package
        run: |
          for v in 0.0.0-e2e 0.0.1-e2e 0.0.2-e2e; do
            bun scripts/package.ts --version "$v" --arch amd64 --out dist
          done

      - name: Releases to update to
        run: |
          # Two: a good one, and one whose panel won't start.
          mkdir -p "$RUNNER_TEMP/broken"
          tar -xzf dist/flytower-0.0.2-e2e-linux-amd64.tar.gz -C "$RUNNER_TEMP/broken"
          rm "$RUNNER_TEMP/broken/flytower-0.0.2-e2e/panel/server/index.mjs"
          tar -czf dist/flytower-0.0.2-e2e-linux-amd64.tar.gz -C "$RUNNER_TEMP/broken" flytower-0.0.2-e2e
          for v in 0.0.1-e2e 0.0.2-e2e; do
            d="releases/v$v"
            mkdir -p "$d"
            cp "dist/flytower-$v-linux-amd64.tar.gz" "$d/"
            (cd "$d" && sha256sum flytower-*.tar.gz > SHA256SUMS)
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/e2e-key.pem" -rawin -in "$d/SHA256SUMS" |
              base64 -w0 > "$d/SHA256SUMS.sig"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-dist
          path: |
            dist/flytower-*.tar.gz
            releases/
            installer/install.sh
            installer/release-key.pem
          retention-days: 1

  install-and-run:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # For the browser smoke test.
      - run: bun install --frozen-lockfile
      # The packages, signed test releases, and the installer with the test key in it.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-dist

      - name: Boot a systemd container
        run: |
          docker build -t flytower-e2e tests/e2e
          docker run -d --name vps --privileged --cgroupns=host --network host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /run/lock \
            -v "$PWD:/src:ro" flytower-e2e
          for _ in $(seq 1 30); do
            state="$(docker exec vps systemctl is-system-running 2>/dev/null || true)"
            [[ "$state" == running || "$state" == degraded ]] && break
            sleep 1
          done
          echo "systemd: $state"

      - name: Install
        run: |
          docker exec vps bash /src/installer/install.sh --domain localhost \
            --tarball /src/dist/flytower-0.0.0-e2e-linux-amd64.tar.gz \
            --no-caddy --no-firewall --setup-token e2e-setup-token
          docker exec vps grep NUXT_APP_SECRET /etc/flytower/panel.env > first.env

      - name: Install again (must be safe)
        run: |
          docker exec vps bash /src/installer/install.sh --domain localhost \
            --tarball /src/dist/flytower-0.0.0-e2e-linux-amd64.tar.gz \
            --no-caddy --no-firewall --setup-token e2e-setup-token
          docker exec vps grep NUXT_APP_SECRET /etc/flytower/panel.env > second.env
          cmp first.env second.env && echo "secret kept across re-runs"
          docker exec vps systemctl is-active flytower-agent flytower-panel

      - name: Install again with no version option (keeps the installed one)
        run: |
          docker exec vps bash /src/installer/install.sh --domain localhost \
            --no-caddy --no-firewall --setup-token e2e-setup-token | tee rerun.log
          grep -q 'already installed; keeping that version' rerun.log
          docker exec vps cat /opt/flytower/current/VERSION | grep -qx 0.0.0-e2e
          docker exec vps systemctl is-active flytower-agent flytower-panel

      - name: S3-compatible storage for off-site backups
        run: |
          # Adobe's S3Mock speaks the S3 API (multipart included) and ignores credentials.
          docker run -d --name s3 --network host -e initialBuckets=mc-backups adobe/s3mock:3.12.0
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:9090/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:9090/ | head -c 300

      - name: Smoke test in a browser
        env:
          E2E_URL: http://localhost:3000
          E2E_SETUP_TOKEN: e2e-setup-token
          E2E_SHOTS: ${{ runner.temp }}/shots
        run: mkdir -p "$E2E_SHOTS" && bun tests/e2e/smoke.ts

      - name: Emergency SSH closes on time, even across an agent restart
        run: |
          call() { docker exec vps /opt/flytower/current/bin/bun /src/tests/e2e/agent-call.ts "$@"; }
          ssh_rules() { docker exec vps ufw status | grep -E '^(22/tcp|OpenSSH)' || true; }
          # The container shares the runner's network, so turn ufw on without blocking anything:
          # the test only needs the SSH rules to come and go.
          docker exec vps sh -c 'ufw default allow incoming >/dev/null && ufw allow 22/tcp >/dev/null && ufw --force enable'
          call ssh.set '{"open":false}'
          if [ -n "$(ssh_rules)" ]; then echo "SSH still open after closing"; exit 1; fi
          call ssh.set '{"open":true,"minutes":1}'
          if [ -z "$(ssh_rules)" ]; then echo "SSH not opened"; exit 1; fi
          docker exec vps systemctl restart flytower-agent
          sleep 75
          call ssh.status
          if [ -n "$(ssh_rules)" ]; then echo "SSH still open after the window"; exit 1; fi
          # Leave it as the installer did.
          call ssh.set '{"open":true}'
          docker exec vps ufw --force disable

      - name: Hostname router starts, takes routes and answers
        run: |
          docker exec vps /opt/flytower/current/bin/bun /src/tests/e2e/router.ts || {
            docker exec vps journalctl -u flytower-router --no-pager -n 50 || true
            exit 1
          }

      - name: The Rust agent, and nothing else
        run: |
          kind() { bash tests/e2e/agent-kind.sh; }
          expect() { k="$(kind)"; [ "$k" = rust ] || { echo "expected the Rust agent, got $k: $1"; exit 1; }; echo "✓ rust: $1"; }
          answers() {
            for _ in $(seq 1 10); do
              docker exec vps /opt/flytower/current/bin/bun /src/tests/e2e/agent-call.ts ssh.status && return 0
              sleep 1
            done
            echo "the agent doesn't answer"; exit 1
          }
          restart() { docker exec vps sh -c 'systemctl reset-failed flytower-agent; systemctl restart flytower-agent'; }

          expect "a fresh install"
          answers
          # The release carries no Bun agent to fall back to.
          docker exec vps sh -c 'test ! -e /opt/flytower/current/agent' || { echo "a Bun agent is still in the release"; exit 1; }

          # 1.4 chose Bun with `bun` in /etc/flytower/agent. That file means nothing now.
          docker exec vps sh -c 'echo bun > /etc/flytower/agent'
          restart
          expect "the old Bun switch is ignored"
          answers
          docker exec vps rm /etc/flytower/agent

      - name: Self-update, and roll back an update that won't start
        run: |
          call() { docker exec vps /opt/flytower/current/bin/bun /src/tests/e2e/agent-call.ts "$@"; }
          health() { docker exec vps curl -fsS http://127.0.0.1:3000/api/health || true; }
          last_state() { call update.status | sed -n 's/.*"state":"\([a-z-]*\)".*/\1/p'; }
          # Serve the signed test releases; the container shares the runner's network.
          (cd releases && python3 -m http.server 8765 >/dev/null 2>&1 &)
          docker exec vps sh -c 'mkdir -p /etc/systemd/system/flytower-agent.service.d &&
            printf "[Service]\nEnvironment=FLYTOWER_RELEASES_URL=http://127.0.0.1:8765\n" \
              > /etc/systemd/system/flytower-agent.service.d/e2e.conf &&
            systemctl daemon-reload && systemctl restart flytower-agent'
          sleep 3

          call update.install '{"version":"0.0.1-e2e"}'
          for _ in $(seq 1 60); do [ "$(last_state)" = succeeded ] && break; sleep 3; done
          health | grep -q '"version":"0.0.1-e2e"' || { echo "not updated: $(health)"; call update.status; exit 1; }
          echo "✓ updated to 0.0.1-e2e"
          # The new release's Rust agent took over.
          [ "$(bash tests/e2e/agent-kind.sh)" = rust ] || { echo "not on the Rust agent after updating"; exit 1; }

          call update.install '{"version":"0.0.2-e2e"}'
          for _ in $(seq 1 80); do [ "$(last_state)" = rolled-back ] && break; sleep 3; done
          call update.status
          [ "$(last_state)" = rolled-back ] || { echo "the broken update didn't roll back"; exit 1; }
          for _ in $(seq 1 30); do health | grep -q '"version":"0.0.1-e2e"' && break; sleep 2; done
          health | grep -q '"version":"0.0.1-e2e"' || { echo "not back on 0.0.1-e2e: $(health)"; docker exec vps ls -la /var/lib/flytower /var/lib/flytower-agent/db-backups; exit 1; }
          echo "✓ a broken update rolled back to 0.0.1-e2e"
          [ "$(bash tests/e2e/agent-kind.sh)" = rust ] || { echo "not on the Rust agent after rolling back"; exit 1; }

      - name: Logs
        if: always()
        run: |
          docker exec vps journalctl -u flytower-agent -u flytower-panel -u 'flytower-mc@*' -u 'flytower-update-*' --no-pager -n 300 || true
          docker exec vps sh -c 'tail -n 80 /srv/flytower/servers/*/logs/latest.log' || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  releases:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          ALL: ${{ inputs.all_upgrades && 'all' || '' }}
        # Releases only (v-tags, betas included); pull request test builds (pr-*) aren't upgrade sources.
        # By default, the newest release of each minor version (0.5.0, 1.0.1, 1.1.0-beta.5...):
        # every schema and config generation still gets an upgrade, without one job per beta.
        # The API lists newest first, and group_by keeps that order within each group.
        run: |
          versions="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '[.[] | select(.draft | not) | .tag_name | select(startswith("v")) | ltrimstr("v")]' | jq -sc 'add // []')"
          if [ "$ALL" != all ]; then
            versions="$(jq -c 'group_by(split(".")[0:2]) | map(.[0])' <<<"$versions")"
          fi
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "$versions"

  upgrade:
    needs: [build, releases]
    if: needs.releases.outputs.versions != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        from: ${{ fromJson(needs.releases.outputs.versions) }}
    name: upgrade from ${{ matrix.from }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-dist
      - name: Boot a systemd container
        run: |
          mkdir -p old
          docker build -t flytower-e2e tests/e2e
          docker run -d --name vps --privileged --cgroupns=host --network host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /run/lock \
            -v "$PWD:/src:ro" flytower-e2e
          for _ in $(seq 1 30); do
            state="$(docker exec vps systemctl is-system-running 2>/dev/null || true)"
            [[ "$state" == running || "$state" == degraded ]] && break
            sleep 1
          done
      - name: Upgrade from ${{ matrix.from }}
        env:
          FROM: ${{ matrix.from }}
        run: bash tests/e2e/upgrade.sh "$FROM" /src/dist/flytower-0.0.0-e2e-linux-amd64.tar.gz
      - name: Logs
        if: failure()
        run: docker exec vps journalctl -u flytower-agent -u flytower-panel --no-pager -n 200 || true
