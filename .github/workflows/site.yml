name: Website

# Builds the website (apps/site) on every change and attaches the output to the run, so a broken
# site never merges. Once Cloudflare credentials are added as repository secrets, pull requests
# get a preview URL and main (and each release, to refresh the changelog) deploys to flytower.dev.
#
# Secrets: CLOUDFLARE_ACCOUNT_ID, and CLOUDFLARE_API_TOKEN with Account > Workers Scripts > Edit
# (Admin the first time, to create the Worker), Account > Secrets Store > Read (the mailing list's
# Turnstile secret), and Zone > Workers Routes > Edit on flytower.dev.

on:
  push:
    branches: [main]
    paths: [apps/site/**, docs/**, bun.lock, .github/workflows/site.yml]
  pull_request:
    paths: [apps/site/**, docs/**, bun.lock, .github/workflows/site.yml]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The changelog page reads releases from the GitHub API at build time.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Pull request previews take mailing list sign-ups so they can be tested; flytower.dev stays
      # closed until the privacy policy covers the list.
      NEWSLETTER_OPEN: ${{ github.event_name == 'pull_request' }}
    steps:
      # A new release only needs the changelog rebuilt, so build the site from main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || '' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build:site

      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: apps/site/.output
          retention-days: 14

      - name: Preview deploy
        id: preview
        if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: apps/site
        run: |
          # Previews hand mailing list sign-ups to the staging service, never the live list.
          sed -i 's/"service": "platform-api"/"service": "platform-api-staging"/' wrangler.jsonc
          grep -q '"service": "platform-api-staging"' wrangler.jsonc
          out=$(bunx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }} @ ${GITHUB_SHA::7}" 2>&1)
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://pr-[^ ]+\.workers\.dev' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview link
        if: steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- site-preview -->'
            const body = `${marker}\n**Website preview:** ${{ steps.preview.outputs.url }}\n\nUpdated for ${context.sha.slice(0, 7)}.`
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number })
            const mine = comments.find((c) => c.body?.includes(marker))
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body })
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && (github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
        working-directory: apps/site
        run: bunx wrangler deploy
