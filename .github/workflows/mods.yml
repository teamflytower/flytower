name: Mods

# Builds and tests the flytower-proxy Fabric mod. Only runs when the mod or the PROXY header
# fixtures it shares with the router change.
on:
  push:
    branches: [main]
    paths:
      - 'mods/**'
      - 'protocol/fixtures/proxy-v2.jsonl'
      - '.github/workflows/mods.yml'
  pull_request:
    paths:
      - 'mods/**'
      - 'protocol/fixtures/proxy-v2.jsonl'
      - '.github/workflows/mods.yml'

permissions:
  contents: read

jobs:
  flytower-proxy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mods/flytower-proxy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: mods/flytower-proxy/*.gradle*
      - name: Build and test
        run: ./gradlew build --no-daemon --console=plain
