[package]
name = "flytower-map"
description = "Draws web map tiles from Minecraft region files for the Flytower panel: reads worlds from outside the server, redraws only what changed."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
flytower-anvil = { path = "../flytower-anvil" }
flate2 = "1.1.11"
png = "0.18.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[lints]
workspace = true
