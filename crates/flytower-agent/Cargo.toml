[package]
name = "flytower-agent"
description = "Flytower's system helper: runs as root and does a fixed list of jobs for the panel."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
flytower-du = { path = "../flytower-du" }
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "net", "process", "rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false }
futures-lite = { version = "2", default-features = false }
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy"] }

[features]
# Test-only verbs (the `testing.*` subscriptions) and the flytower-agent-testing binary,
# which serves them on a socket without root. Never in a release.
testing = []

[[bin]]
name = "flytower-agent-testing"
required-features = ["testing"]

[lints]
workspace = true
