org.gradle.jvmargs=-Xmx2G
org.gradle.configuration-cache=false

# The mod's own version. Bump it when the mod changes, never for a Flytower release alone: the
# panel swaps a server's copy whenever the jar's bytes change, and the server only reads real
# addresses again after its next restart.
mod_version=1.0.0

# The Minecraft version the mod is built against. It reads only Connection's address and the
# server's listener, which rarely change, so fabric.mod.json accepts any 26.x release.
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.4
junit_version=6.1.3
